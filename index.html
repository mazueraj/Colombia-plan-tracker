<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>89kg Goal - Mission Control</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #ffffff;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--primary); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-radius: 16px 16px 0 0; }
        #countdown-container { background: #1e293b; color: #fbbf24; padding: 12px; font-size: 1.3rem; font-weight: 800; }
        
        #dashboard { position: fixed; top: 0; right: -320px; width: 280px; height: 100%; background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 1000; transition: 0.5s; padding: 30px 20px; }
        #dashboard.open { right: 0; }
        .dash-toggle { position: fixed; top: 50%; right: 0; background: var(--primary); color: white; padding: 20px 12px; border-radius: 12px 0 0 12px; cursor: pointer; z-index: 1001; writing-mode: vertical-rl; font-weight: 900; }

        .tabs-container { background: #e2e8f0; padding: 10px 10px 0; }
        .tabs { display: flex; gap: 5px; overflow-x: auto; }
        .tab-btn { padding: 15px 25px; border: none; background: #cbd5e1; cursor: pointer; font-weight: 700; border-radius: 12px 12px 0 0; color: #475569; }
        .tab-btn.active { background: white; color: var(--accent); }

        .week-content { display: none; padding: 25px 0; }
        .week-content.active { display: block; }
        .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .day-card { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 20px; padding: 20px; transition: all 0.4s ease; }
        .status-red { border-color: var(--danger); }
        .status-amber { border-color: var(--warning); }
        .status-green { border-color: var(--success); background-color: #f0fdf4; transform: translateY(-5px); box-shadow: 0 12px 20px rgba(34, 197, 94, 0.15); }

        .day-header { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .data-box { background: #f1f5f9; padding: 10px; border-radius: 12px; text-align: center; }
        .data-box.actual { background: #dbeafe; border: 1px solid var(--accent); }
        .data-box small { display: block; font-size: 0.6rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .data-box input { width: 100%; background: transparent; border: none; text-align: center; font-size: 1.1rem; font-weight: 800; color: var(--accent); outline: none; }

        .check-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; cursor: pointer; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; }

        .progress-container { margin-top: 15px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.4s; }
    </style>
</head>
<body>
    <div class="dash-toggle" onclick="document.getElementById('dashboard').classList.toggle('open')">STATS DASHBOARD</div>
    <div id="dashboard">
        <h2 style="margin-top:0">Mission Progress</h2>
        <div id="stats-content">Select items to see progress.</div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:40px; padding:10px; background:#fee2e2; border:1px solid #ef4444; color:#ef4444; border-radius:8px; cursor:pointer; width:100%;">Reset All Data</button>
    </div>

    <div class="container">
        <header>
            <h1 style="margin:0; letter-spacing: 2px;">OPERATION 89KG</h1>
            <div id="countdown-container">TIME UNTIL COLOMBIA: <span id="timer">--d --h --m --s</span></div>
        </header>

        <div class="tabs-container">
            <div class="tabs" id="tabs-list"></div>
        </div>
        <div id="weeks-container"></div>
    </div>

    <script>
        const startDate = new Date(2026, 3, 20); // Monday April 20, 2026
        const travelDate = new Date("June 09, 2026 00:00:00").getTime();
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        function init() {
            let tabsHtml = '';
            let weeksHtml = '';
            
            for (let i = 0; i < 7; i++) {
                let weekStart = new Date(startDate);
                weekStart.setDate(startDate.getDate() + (i * 7));
                
                tabsHtml += `<button class="tab-btn ${i===0?'active':''}" onclick="showWeek(${i})">W${i+1}<br><small>${weekStart.toLocaleDateString('en-US', {month:'short', day:'numeric'})}</small></button>`;
                
                weeksHtml += `<div id="week-${i}" class="week-content ${i===0?'active':''}"> <div class="day-grid">`;
                
                days.forEach((dayName, j) => {
                    let currentDay = new Date(weekStart);
                    currentDay.setDate(weekStart.getDate() + j);
                    let dateStr = currentDay.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit'});
                    let dayId = `w${i}-d${j}`;
                    
                    let calTarget = i === 0 ? "1,200" : "1,750";
                    let weightTarget = (96.0 - (i * 1.0) - (j * 0.14)).toFixed(1);
                    let dinnerText = i === 0 ? "🔴 No-Carb Dinner" : "🔵 Protein + 1 Cup Carb";

                    weeksHtml += `
                        <div class="day-card" id="card-${dayId}">
                            <div class="day-header">${dayName} <span>${dateStr}</span></div>
                            <div class="data-row">
                                <div class="data-box"><small>Goal Cal</small><strong>${calTarget}</strong></div>
                                <div class="data-box actual"><small>Actual Cal</small><input type="text" id="cal-${dayId}" oninput="saveData()" placeholder="----"></div>
                            </div>
                            <div class="data-row">
                                <div class="data-box"><small>Goal KG</small><strong>${weightTarget}</strong></div>
                                <div class="data-box actual"><small>Actual KG</small><input type="text" id="kg-${dayId}" oninput="saveData()" placeholder="0.0"></div>
                            </div>
                            <div class="checklist">
                                ${["Shake + Pro", "2 Eggs", "Lunch Shake", "Tuna", dinnerText, "10k Steps", "4L Water"].map((item, idx) => `
                                    <label class="check-item">
                                        <input type="checkbox" id="check-${dayId}-${idx}" onchange="updateDay('${dayId}')"> ${item}
                                    </label>
                                `).join('')}
                            </div>
                            <div class="progress-container"><div class="progress-bar" id="bar-${dayId}"></div></div>
                        </div>`;
                });
                weeksHtml += `</div></div>`;
            }
            document.getElementById('tabs-list').innerHTML = tabsHtml;
            document.getElementById('weeks-container').innerHTML = weeksHtml;
            loadData();
        }

        function showWeek(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.querySelectorAll('.week-content').forEach((content, i) => content.classList.toggle('active', i === index));
            updateDashboard();
        }
