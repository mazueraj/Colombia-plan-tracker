<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission 89kg</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1616/1616487.png">
    <meta name="theme-color" content="#ffffff">

    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f1f5f9; --card-bg: #ffffff;
            --text: #1e293b; --text-light: #64748b; --success: #22c55e; --border: #e2e8f0;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); 
            margin: 0; padding: 0; color: var(--text); overscroll-behavior: none;
        }

        header { background: white; padding: 40px 20px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        #countdown-container { background: #f8fafc; color: var(--accent); padding: 12px; font-size: 1.1rem; font-weight: 800; border-radius: 12px; margin: 10px 20px; border: 1px solid var(--border); }

        #dashboard { 
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 350px; height: 100%; 
            background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 2000; 
            transition: 0.4s ease; padding: 40px 25px; box-sizing: border-box;
        }
        #dashboard.open { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 1999; }
        .overlay.active { display: block; }

        .stat-card { background: #f8fafc; padding: 15px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--border); }
        .stat-card h4 { margin: 0 0 5px 0; font-size: 0.7rem; text-transform: uppercase; color: var(--text-light); }
        .stat-val { font-size: 1.4rem; font-weight: 900; }

        .tabs-container { background: white; position: sticky; top: 0; padding: 10px 10px 0; border-bottom: 1px solid var(--border); z-index: 100; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .tab-btn { padding: 12px 20px; border: 1px solid var(--border); background: #f8fafc; cursor: pointer; font-weight: 700; border-radius: 10px; color: var(--text-light); white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .week-content { display: none; }
        .week-content.active { display: block; }

        .container { padding: 20px; padding-bottom: 100px; }
        .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .day-card { background: white; border: 1px solid var(--border); border-radius: 24px; padding: 20px; position: relative; }
        .day-card.past { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
        .day-card.today { border-color: var(--accent); border-width: 2px; }

        .data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .data-box { background: #f8fafc; padding: 10px; border-radius: 12px; text-align: center; }
        .data-box.actual { border: 1px solid var(--accent); background: white; }
        .data-box input { width: 100%; background: transparent; border: none; text-align: center; font-size: 1.1rem; font-weight: 800; color: var(--accent); outline: none; }

        .check-item { display: flex; align-items: center; padding: 10px; background: #f8fafc; margin-bottom: 6px; border-radius: 10px; font-size: 0.9rem; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--accent); }

        .progress-bar-wrap { background:#f1f5f9; height:6px; border-radius:10px; margin-top:15px; overflow:hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: 0.4s; }
        .dash-toggle { position: fixed; bottom: 30px; right: 20px; background: var(--primary); color: white; width: 65px; height: 65px; border-radius: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 1001; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="toggleDash()"></div>
    <div id="dashboard">
        <h2 style="margin-top:0">Mission Status</h2>
        <div class="stat-card"><h4>Weekly Cal (Act/Goal)</h4><div class="stat-val" id="stat-cal">0 / 0</div></div>
        <div class="stat-card"><h4>Latest Weight</h4><div class="stat-val" id="stat-weight">-- kg</div></div>
        <div class="stat-card"><h4>Objectives</h4><div class="stat-val" id="stat-pct">0%</div><div class="progress-bar-wrap"><div id="stat-bar" style="height:100%; width:0%; background:var(--success); transition: 1s;"></div></div></div>
        <button onclick="if(confirm('Reset all?')){localStorage.clear(); location.reload();}" style="width:100%; background:none; border:1px solid #fee2e2; color:#ef4444; padding:10px; border-radius:10px; margin-top:20px;">Reset Data</button>
    </div>

    <div class="dash-toggle" onclick="toggleDash()">📊</div>

    <header>
        <h1 style="margin:0; font-weight: 900;">MISSION <span style="color:var(--accent)">89KG</span></h1>
        <div id="countdown-container">COLOMBIA: <span id="timer">--d --h --m</span></div>
    </header>

    <div class="tabs-container"><div class="tabs" id="tabs-list"></div></div>
    <div class="container"><div id="weeks-container"></div></div>

    <script>
        const startDate = new Date(2026, 3, 20); // Apr 20
        const travelDate = new Date("June 09, 2026 00:00:00").getTime();
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        let currentWeekIdx = 0;

        function toggleDash() {
            document.getElementById('dashboard').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
            if(document.getElementById('dashboard').classList.contains('open')) updateDashboard();
        }

        function init() {
            const now = new Date(); now.setHours(0,0,0,0);
            let tabsHtml = ''; let weeksHtml = '';
            
            for (let i = 0; i < 7; i++) {
                let weekStart = new Date(startDate); weekStart.setDate(startDate.getDate() + (i * 7));
                tabsHtml += `<button class="tab-btn ${i===0?'active':''}" id="tbtn-${i}" onclick="showWeek(${i})">Week ${i+1}</button>`;
                weeksHtml += `<div id="week-${i}" class="week-content ${i===0?'active':''}"><div class="day-grid">`;
                
                days.forEach((dayName, j) => {
                    let cDay = new Date(weekStart); cDay.setDate(weekStart.getDate() + j); cDay.setHours(0,0,0,0);
                    let status = (cDay < now) ? "past" : (cDay.getTime() === now.getTime() ? "today" : "");
                    let id = `w${i}-d${j}`;
                    let calT = (i === 0 || i === 1) ? 1200 : 1750;
                    let wgtT = (96.0 - (i * 1.0) - (j * 0.14)).toFixed(1);
                    let dinner = (i === 0 || i === 1) ? "🥗 No-Carb Dinner" : "🍗 Protein + 1 Cup Carb";

                    weeksHtml += `
                        <div class="day-card ${status}" id="card-${id}">
                            <div class="day-header"><b>${dayName}</b> <span style="float:right; font-size:0.8rem; color:var(--text-light)">${cDay.getDate()}/${cDay.getMonth()+1}</span></div>
                            <div class="data-row">
                                <div class="data-box"><small>Goal Cal</small><br><span class="g-cal">${calT}</span></div>
                                <div class="data-box actual"><small>Actual</small><input type="number" class="a-cal" id="cal-${id}" oninput="saveData()" placeholder="0"></div>
                            </div>
                            <div class="data-row">
                                <div class="data-box"><small>Goal KG</small><br><span>${wgtT}</span></div>
                                <div class="data-box actual"><small>Actual</small><input type="number" step="0.1" class="a-wgt" id="kg-${id}" oninput="saveData()" placeholder="0.0"></div>
                            </div>
                            <div class="checklist">
                                ${["B-Shake", "2 Eggs", "L-Shake", "Tuna", dinner, "10k Steps", "4L Water"].map((item, idx) => `
                                    <label class="check-item"><input type="checkbox" class="cb" id="chk-${id}-${idx}" onchange="updateDay('${id}')"> ${item}</label>
                                `).join('')}
                            </div>
                            <div class="progress-bar-wrap"><div class="progress-bar" id="bar-${id}"></div></div>
                        </div>`;
                });
                weeksHtml += `</div></div>`;
            }
            document.getElementById('tabs-list').innerHTML = tabsHtml;
            document.getElementById('weeks-container').innerHTML = weeksHtml;
            loadData();
        }

        function showWeek(idx) {
            currentWeekIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.week-content').forEach((c, i) => c.classList.toggle('active', i === idx));
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function updateDay(id) {
            const card = document.getElementById(`card-${id}`);
            const done = card.querySelectorAll('.cb:checked').length;
            const total = card.querySelectorAll('.cb').length;
            document.getElementById(`bar-${id}`).style.width = (done / total * 100) + '%';
            saveData();
        }

        function updateDashboard() {
            const week = document.getElementById(`week-${currentWeekIdx}`);
            let gTotal = 0; let aTotal = 0;
            week.querySelectorAll('.g-cal').forEach(v => gTotal += parseInt(v.innerText));
            week.querySelectorAll('.a-cal').forEach(v => aTotal += parseInt(v.value || 0));
            document.getElementById('stat-cal').innerText = `${aTotal} / ${gTotal}`;

            let weights = Array.from(week.querySelectorAll('.a-wgt')).map(v => parseFloat(v.value)).filter(v => v > 0);
            document.getElementById('stat-weight').innerText = weights.length ? weights[weights.length-1] + " kg" : "-- kg";

            let totalCb = week.querySelectorAll('.cb').length;
            let doneCb = week.querySelectorAll('.cb:checked').length;
            let pct = Math.round((doneCb / totalCb) * 100) || 0;
            document.getElementById('stat-pct').innerText = pct + '%';
            document.getElementById('stat-bar').style.width = pct + '%';
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('input').forEach(el => {
                data[el.id] = el.type === 'checkbox' ? el.checked : el.value;
            });
            localStorage.setItem('missionData', JSON.stringify(data));
        }

        function loadData() {
            const data = JSON.parse(localStorage.getItem('missionData'));
            if (!data) return;
            Object.keys(data).forEach(id => {
                const el = document.getElementById(id);
                if (el) { if (el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; }
            });
            document.querySelectorAll('.day-card').forEach(c => updateDay(c.id.replace('card-','')));
        }

        setInterval(() => {
            const dist = travelDate - new Date().getTime();
            if (dist < 0) return;
            document.getElementById("timer").innerHTML = Math.floor(dist/86400000) + "d " + Math.floor((dist%86400000)/3600000) + "h " + Math.floor((dist%3600000)/60000) + "m";
        }, 1000);

        init();
    </script>
</body>
</html>
