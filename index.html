<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission 89kg</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="89kg Mission">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1616/1616487.png">
    <meta name="theme-color" content="#0f172a">

    <style>
        :root {
            --primary: #0f172a;      /* Deep Navy */
            --accent: #3b82f6;       /* Electric Blue */
            --bg: #020617;          /* Slate Black */
            --card-bg: #1e293b;     /* Slate Navy */
            --text: #f8fafc;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 0; color: var(--text);
            overscroll-behavior: none; /* Prevents "pull to refresh" bounce on apps */
        }

        /* Splash Screen Effect on Header */
        header { 
            background: linear-gradient(180deg, var(--primary) 0%, var(--bg) 100%);
            color: white; padding: 40px 20px; text-align: center; 
        }

        #countdown-container { 
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent); padding: 15px; 
            font-size: 1.1rem; font-weight: 800; border-radius: 12px;
            margin: 10px 20px; border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* App Tabs */
        .tabs-container { background: var(--primary); sticky: top; padding: 10px 10px 0; border-bottom: 1px solid #334155; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .tab-btn { 
            padding: 12px 20px; border: none; background: #334155; 
            cursor: pointer; font-weight: 700; border-radius: 10px; 
            color: #94a3b8; white-space: nowrap; transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        .container { padding: 20px; }
        .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .day-card { 
            background: var(--card-bg); border: 1px solid #334155; 
            border-radius: 24px; padding: 20px; transition: 0.4s;
        }
        
        .status-green { border-color: var(--success); box-shadow: 0 0 20px rgba(34, 197, 94, 0.1); }

        .day-header { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--accent); }

        /* Data Input Styling */
        .data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .data-box { background: #0f172a; padding: 12px; border-radius: 16px; text-align: center; border: 1px solid #1e293b; }
        .data-box.actual { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .data-box small { display: block; font-size: 0.65rem; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .data-box input { 
            width: 100%; background: transparent; border: none; 
            text-align: center; font-size: 1.2rem; font-weight: 800; color: white; outline: none; 
        }

        /* Modern Checkboxes */
        .check-item { 
            display: flex; align-items: center; padding: 12px; 
            background: rgba(255,255,255,0.03); margin-bottom: 8px;
            border-radius: 12px; font-size: 0.95rem; cursor: pointer;
        }
        input[type="checkbox"] { 
            width: 22px; height: 22px; border-radius: 6px; 
            margin-right: 15px; accent-color: var(--accent); 
        }

        .progress-container { margin-top: 20px; height: 6px; background: #0f172a; border-radius: 10px; }
        .progress-bar { height: 100%; width: 0%; border-radius: 10px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        #dashboard { 
            position: fixed; top: 0; right: -320px; width: 280px; height: 100%; 
            background: var(--primary); padding: 40px 25px; transition: 0.5s; z-index: 1000;
        }
        #dashboard.open { right: 0; }
        .dash-toggle { 
            position: fixed; bottom: 30px; right: 20px; 
            background: var(--accent); color: white; width: 60px; height: 60px; 
            border-radius: 30px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); z-index: 1001;
        }
    </style>
</head>
<body>
    <div class="dash-toggle" onclick="document.getElementById('dashboard').classList.toggle('open')">📈</div>
    
    <div id="dashboard">
        <h2 style="color:var(--accent)">Mission Stats</h2>
        <div id="stats-content"></div>
        <button onclick="if(confirm('Clear all logs?')){localStorage.clear(); location.reload();}" 
                style="position:absolute; bottom:40px; left:25px; width:230px; background:transparent; color:var(--danger); border:1px solid var(--danger); padding:10px; border-radius:10px;">
            Reset Everything
        </button>
    </div>

    <header>
        <h1 style="margin:0; font-size: 2.2rem; letter-spacing: -1px;">MISSION <span style="color:var(--accent)">89KG</span></h1>
        <div id="countdown-container">COLOMBIA IN: <span id="timer">--d --h --m --s</span></div>
    </header>

    <div class="tabs-container">
        <div class="tabs" id="tabs-list"></div>
    </div>

    <div class="container">
        <div id="weeks-container"></div>
    </div>

    <script>
        const startDate = new Date(2026, 3, 20); // Monday April 20, 2026
        const travelDate = new Date("June 09, 2026 00:00:00").getTime();
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        function init() {
            let tabsHtml = '';
            let weeksHtml = '';
            
            for (let i = 0; i < 7; i++) {
                let weekStart = new Date(startDate);
                weekStart.setDate(startDate.getDate() + (i * 7));
                tabsHtml += `<button class="tab-btn ${i===0?'active':''}" id="tbtn-${i}" onclick="showWeek(${i})">W${i+1}</button>`;
                weeksHtml += `<div id="week-${i}" class="week-content ${i===0?'active':''}"><div class="day-grid">`;
                
                days.forEach((dayName, j) => {
                    let dayId = `w${i}-d${j}`;
                    let calT = i === 0 ? "1,200" : "1,750";
                    let wgtT = (96.0 - (i * 1.0) - (j * 0.14)).toFixed(1);
                    let dinner = i === 0 ? "🔴 No-Carb Dinner" : "🔵 Protein + 1 Cup Carb";

                    weeksHtml += `
                        <div class="day-card" id="card-${dayId}">
                            <div class="day-header">${dayName}</div>
                            <div class="data-row">
                                <div class="data-box"><small>GOAL CAL</small><strong>${calT}</strong></div>
                                <div class="data-box actual"><small>ACTUAL</small><input type="text" id="cal-${dayId}" oninput="saveData()" placeholder="0"></div>
                            </div>
                            <div class="data-row">
                                <div class="data-box"><small>GOAL KG</small><strong>${wgtT}</strong></div>
                                <div class="data-box actual"><small>ACTUAL</small><input type="text" id="kg-${dayId}" oninput="saveData()" placeholder="0.0"></div>
                            </div>
                            <div class="checklist">
                                ${["Shake + Protein", "2 Boiled Eggs", "Lunch Shake", "Tuna (95g)", dinner, "10k Steps", "4L Water"].map((item, idx) => `
                                    <label class="check-item"><input type="checkbox" id="chk-${dayId}-${idx}" onchange="updateDay('${dayId}')">${item}</label>
                                `).join('')}
                            </div>
                            <div class="progress-container"><div class="progress-bar" id="bar-${dayId}" style="background:var(--accent)"></div></div>
                        </div>`;
                });
                weeksHtml += `</div></div>`;
            }
            document.getElementById('tabs-list').innerHTML = tabsHtml;
            document.getElementById('weeks-container').innerHTML = weeksHtml;
            loadData();
        }

        function showWeek(idx) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.week-content').forEach((c, i) => c.classList.toggle('active', i === idx));
            window.scrollTo({top: 0, behavior: 'smooth'});
            updateDashboard();
        }

        function updateDay(id) {
            const card = document.getElementById(`card-${id}`);
            const checks = card.querySelectorAll('input[type="checkbox"]');
            const done = card.querySelectorAll('input[type="checkbox"]:checked').length;
            const pct = (done / checks.length) * 100;
            const bar = document.getElementById(`bar-${id}`);
            bar.style.width = pct + '%';
            
            card.classList.toggle('status-green', pct === 100);
            bar.style.backgroundColor = pct === 100 ? 'var(--success)' : 'var(--accent)';
            saveData();
            updateDashboard();
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('input').forEach(el => {
                data[el.id] = el.type === 'checkbox' ? el.checked : el.value;
            });
            localStorage.setItem('missionData', JSON.stringify(data));
        }

        function loadData() {
            const data = JSON.parse(localStorage.getItem('missionData'));
            if (!data) return;
            Object.keys(data).forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (el.type === 'checkbox') el.checked = data[id];
                    else el.value = data[id];
                }
            });
            document.querySelectorAll('.day-card').forEach(c => updateDay(c.id.replace('card-','')));
        }

        function updateDashboard() {
            const active = document.querySelector('.week-content.active');
            const checked = active.querySelectorAll('input[type="checkbox"]:checked').length;
            const total = active.querySelectorAll('input[type="checkbox"]').length;
            const score = Math.round((checked/total)*100) || 0;
            document.getElementById('stats-content').innerHTML = `
                <div style="font-size: 4rem; font-weight: 900; color: var(--accent); line-height:1;">${score}%</div>
                <p style="letter-spacing:2px; font-size:0.8rem; margin-bottom:30px;">WEEKLY COMPLETION</p>
            `;
        }

        setInterval(() => {
            const now = new Date().getTime();
            const dist = travelDate - now;
            document.getElementById("timer").innerHTML = Math.floor(dist / 86400000) + "d " + Math.floor((dist % 86400000) / 3600000) + "h " + Math.floor((dist % 3600000) / 60000) + "m " + Math.floor((dist % 60000) / 1000) + "s ";
        }, 1000);

        init();
    </script>
</body>
</html>
